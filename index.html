<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt Cấu Hình - Locket Gold</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 30px 20px;
            /* Ảnh nền ANH.JPEG hiển thị toàn màn hình */
            background: url('ANH1.JPG') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .logo-container {
            margin-bottom: 10px;
        }
        /* Style cho Logo Locket Gold */
        .locket-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .locket-logo svg {
            width: 45px;
            height: 45px;
            fill: white;
        }
        
        /* Hiệu ứng 7 màu cầu vồng chạy qua chạy lại (trái <-> phải) */
        .rainbow-text {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            animation: rainbowMove 3s linear infinite alternate;
        }

        @keyframes rainbowMove {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* Chữ Locket Gold to */
        .app-name {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .developer {
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 600;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }
        p {
            font-size: 15px;
            max-width: 380px;
            margin: 0 0 25px 0;
            line-height: 1.5;
            font-weight: 600;
        }
        .btn { 
            background: #007aff; 
            color: white; 
            padding: 15px 30px; 
            text-decoration: none; 
            border-radius: 14px; 
            font-size: 16px; 
            display: inline-block; 
            font-weight: bold; 
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { 
            background: #0056b3; 
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <!-- Logo Locket Gold -->
        <div class="locket-logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
    </div>

    <div class="app-name rainbow-text">Locket Gold</div>

    <div class="developer rainbow-text">
        Developer : Plat • Dex
    </div>

    <h1 class="rainbow-text">Cài Đặt Cấu Hình Hệ Thống</h1>
    <p class="rainbow-text">Nhấn vào nút bên dưới để tải và cài đặt cấu hình trên thiết bị iOS của bạn.</p>
    
    <!-- Thay thế link bên dưới bằng tên tệp mobileconfig thực tế của bạn -->
    <a href="./config.mobileconfig" class="btn">Tải về Cấu hình</a>
</body>
</html>
